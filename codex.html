<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HIVEFALL · 军械库</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1016">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/ui/fonts/fonts.css">
<style>
  :root {
    --bg: #0b1016; --panel: #121a23; --panel-2: #0d141b; --line: #2a3a4a; --line-2: #41586d;
    --amber: #ffb02e; --amber-2: #ffd27a; --cyan: #5fe0ff; --red: #ff4d3d; --green: #63e39a; --elite: #b48cff;
    --text: #d9e4ee; --dim: #8b9cae; --faint: #56687a;
    --f-cn: 'ZCOOL QingKe HuangYou', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    --f-num: 'Oxanium', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    --f-ui: 'Rajdhani', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    --f-mono: 'Share Tech Mono', 'Noto Sans SC', monospace;
    --cut: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 500 15px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; }
  body { display: grid; grid-template-rows: auto 1fr auto; min-height: 100%; overflow: hidden; }
  a { color: var(--cyan); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .ic { display: inline-block; width: 1em; height: 1em; flex: none; background: currentColor; -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; vertical-align: -0.14em; }

  header { display: flex; align-items: center; gap: 18px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #111a23, #0b1016); }
  .logo { font: 700 22px/1 'Orbitron', var(--f-cn); letter-spacing: 0.18em; color: #fff; }
  .logo small { display: block; margin-top: 4px; font: 400 11px/1 var(--f-mono); letter-spacing: 0.2em; color: var(--amber); }
  .hd-t { font: 400 24px/1 var(--f-cn); letter-spacing: 0.1em; color: var(--amber-2); }
  .sp { flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; background: rgba(18, 26, 35, 0.9); box-shadow: inset 0 0 0 1px var(--line-2); clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px); font-weight: 600; text-decoration: none; color: var(--text); }
  .btn:hover { box-shadow: inset 0 0 0 1px var(--amber); color: var(--amber-2); }
  .btn.on { background: var(--amber); color: #1a1204; box-shadow: none; }

  main { display: grid; grid-template-columns: 280px 1fr 380px; min-height: 0; }
  /* 左：列表 */
  .side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--panel-2); }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px; border-bottom: 1px solid var(--line); }
  .tab { flex: 1 0 auto; padding: 7px 8px; font-size: 14px; font-weight: 600; text-align: center; color: var(--dim); box-shadow: inset 0 0 0 1px var(--line); }
  .tab.on { color: #1a1204; background: var(--amber); box-shadow: none; }
  .list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .it { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; text-align: left; background: rgba(255, 255, 255, 0.025); box-shadow: inset 0 0 0 1px transparent; }
  .it:hover { box-shadow: inset 0 0 0 1px var(--line-2); }
  .it.on { background: rgba(255, 176, 46, 0.12); box-shadow: inset 2px 0 0 var(--amber), inset 0 0 0 1px rgba(255, 176, 46, 0.4); }
  .it .ic { font-size: 24px; color: var(--cyan); }
  .it.enemy .ic, .it.boss .ic { color: #ff8a5c; }
  .it-n { font-size: 16px; font-weight: 600; color: #fff; }
  .it-s { font-size: 12px; color: var(--dim); }

  /* 中：3D */
  .stage { position: relative; min-width: 0; min-height: 0; background: #020305; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .stage-tag { position: absolute; left: 16px; top: 14px; font: 400 12px/1.4 var(--f-mono); letter-spacing: 0.14em; color: var(--cyan); text-shadow: 0 1px 2px #000; pointer-events: none; }
  .stage-name { position: absolute; left: 16px; bottom: 16px; pointer-events: none; text-shadow: 0 2px 6px #000; }
  .stage-name b { display: block; font: 400 34px/1.1 var(--f-cn); color: #fff; letter-spacing: 0.06em; }
  .stage-name span { font-size: 15px; color: var(--amber-2); }
  .clips { position: absolute; right: 14px; bottom: 16px; display: flex; gap: 4px; }
  .clips .btn { height: 30px; font-size: 13px; }
  .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 400 14px var(--f-mono); letter-spacing: 0.3em; color: var(--cyan); background: #020305; }
  .loading[hidden] { display: none; }

  /* 右：数值 */
  .info { overflow-y: auto; padding: 18px 20px 24px; border-left: 1px solid var(--line); background: var(--panel); }
  .eb { font: 400 11px/1 var(--f-mono); letter-spacing: 0.2em; color: var(--amber); margin-bottom: 8px; }
  .nm { font: 400 30px/1.15 var(--f-cn); color: #fff; letter-spacing: 0.05em; }
  .ti { margin-top: 4px; font-size: 15px; color: var(--amber-2); }
  .ds { margin: 12px 0 16px; font-size: 16px; color: #c9d5df; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 16px; }
  .tg { padding: 3px 8px; font-size: 12.5px; font-weight: 600; color: var(--cyan); box-shadow: inset 0 0 0 1px rgba(95, 224, 255, 0.4); }
  .tg.warn { color: #ff9a7a; box-shadow: inset 0 0 0 1px rgba(255, 110, 80, 0.45); }
  .sec { margin: 18px 0 8px; font: 400 11px/1 var(--f-mono); letter-spacing: 0.2em; color: var(--dim); display: flex; align-items: center; gap: 8px; }
  .sec::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .st { padding: 8px 10px; background: rgba(255, 255, 255, 0.03); box-shadow: inset 0 0 0 1px var(--line); }
  .st-k { font-size: 12.5px; color: var(--dim); }
  .st-v { font: 700 21px/1.15 var(--f-num); color: #fff; }
  .st-v small { font: 500 12px var(--f-num); color: var(--dim); margin-left: 3px; }
  .pw { display: flex; gap: 10px; padding: 9px 10px; margin-bottom: 6px; background: rgba(255, 255, 255, 0.03); box-shadow: inset 0 0 0 1px var(--line); }
  .pw .ic { font-size: 28px; color: var(--amber-2); margin-top: 2px; }
  .pw-n { font-weight: 700; color: #fff; }
  .pw-d { font-size: 14px; color: #b7c4cf; }
  .note { margin-top: 14px; font-size: 13px; color: var(--faint); }

  /* 底：署名 */
  footer { max-height: 30vh; overflow-y: auto; padding: 12px 20px 16px; border-top: 1px solid var(--line); background: #080c11; font-size: 13px; color: var(--dim); }
  footer.fold { max-height: 52px; overflow: hidden; }
  .cr-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .cr-head b { font: 400 11px/1 var(--f-mono); letter-spacing: 0.2em; color: var(--amber); }
  .cr-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 6px 18px; margin-bottom: 10px; }
  .cr-sum p { margin: 0; }
  .cr-sum strong { color: var(--text); }
  details { margin: 4px 0; }
  summary { cursor: pointer; color: var(--cyan); }
  .md { padding: 6px 0 6px 14px; border-left: 1px solid var(--line); color: #a9b7c4; overflow-x: auto; }
  .md h1, .md h2, .md h3 { font-size: 14px; color: var(--text); margin: 10px 0 4px; }
  .md table { border-collapse: collapse; font-size: 12px; }
  .md td, .md th { border: 1px solid var(--line); padding: 2px 6px; vertical-align: top; }
  .md ul { margin: 4px 0; padding-left: 18px; }
  .md code { font-family: var(--f-mono); color: var(--amber-2); }
  .md p { margin: 4px 0; }

  @media (max-width: 1100px) { main { grid-template-columns: 230px 1fr 320px; } }
  /* 窄屏 / 竖屏：上 3D，下列表 + 数值 */
  @media (max-width: 820px) {
    body { overflow: auto; display: block; }
    header { flex-wrap: wrap; gap: 10px; padding: 10px 12px; }
    .hd-t { font-size: 20px; }
    main { display: flex; flex-direction: column; }
    .stage { height: 46vh; min-height: 260px; order: 1; }
    .side { order: 2; border-right: 0; border-top: 1px solid var(--line); }
    .list { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 8px; }
    .it { flex: none; width: auto; }
    .info { order: 3; border-left: 0; }
    footer { max-height: none; }
  }
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
<header>
  <div class="logo">HIVEFALL<small>ARMORY // CODEX</small></div>
  <div class="hd-t" id="hd-t">军械库</div>
  <div class="sp"></div>
  <button class="btn" id="lang-zh">中</button><button class="btn" id="lang-en">EN</button>
  <a class="btn" id="back" href="index.html"><i class="ic" data-ic="home"></i><span id="back-t">返回首页</span></a>
</header>
<main>
  <aside class="side"><div class="tabs" id="tabs"></div><div class="list" id="list"></div></aside>
  <section class="stage" id="stage"><canvas id="c"></canvas><div class="stage-tag" id="stage-tag"></div><div class="stage-name" id="stage-name"></div><div class="clips" id="clips"></div><div class="loading" id="loading">LOADING</div></section>
  <aside class="info" id="info"></aside>
</main>
<footer id="credits"></footer>
<script>
  if (location.protocol === 'file:') document.getElementById('loading').textContent = '请用 start.bat 或 node tools/serve.js 启动后从浏览器打开（file:// 下加载不了模块）'
</script>
<script type="module" src="src/codex.js"></script>
</body>
</html>
