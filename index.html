<script>
  // 离线缓存（sw.js）：二次打开时素材直接从本地取。本机开发服务器（localhost / 127.0.0.1）默认不开，免得改了素材刷新看不到：?sw=1 打开、?sw=0 注销
  (function () {
    if (!('serviceWorker' in navigator) || location.protocol === 'file:') return
    var q = /[?&]sw=([01])/.exec(location.search), local = /^(localhost|127\.|\[::1\])/.test(location.hostname)
    if ((q && q[1] === '0') || (local && !q)) { if (q) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister() }) }); return }
    navigator.serviceWorker.register('sw.js').catch(function () {})
  })()
