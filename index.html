<style>
  /* 画布与界面都铺满整个视口：任意缩放 / 全屏都不留黑边。画布的显示尺寸归 CSS，绘制缓冲归渲染器自己管 */
  html, body { margin: 0; width: 100%; height: 100%; background: #05080b; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; inset: 0; overflow: hidden; background: #05080b; }
  #c { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  /* 模块还没下到之前的占位（界面层起来后立刻换成正式加载页） */
  #boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0b1016; color: #ffb02e; font: 700 30px/1 Orbitron, "Segoe UI", sans-serif; letter-spacing: 0.32em; text-indent: 0.32em; }
  #boot small { font: 400 12px/1.4 Consolas, monospace; letter-spacing: 0.18em; text-indent: 0.18em; color: #5f7486; max-width: 80vw; text-align: center; }
  #fps { position: fixed; left: 310px; top: 4px; opacity: 0.85; z-index: 90; padding: 3px 7px; font: 12px/1.3 Consolas, monospace; color: #8dffd0; background: rgba(4, 10, 16, 0.7); pointer-events: none; }
  #fatal { position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%); z-index: 120; max-width: 80vw; padding: 12px 18px; font: 14px/1.5 Consolas, monospace; color: #ff4d3d; background: #121a23; border: 1px solid #ff4d3d; }
  noscript { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: #0b1016; color: #ffb02e; font: 16px sans-serif; }
</style>

<script>

</script>
<script type="module" src="src/main.js"></script>
